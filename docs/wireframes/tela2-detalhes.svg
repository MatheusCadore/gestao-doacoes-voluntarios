<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <rect width="800" height="560" fill="#ffffff"/>
  <rect x="10" y="10" width="780" height="540" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Navbar -->
  <rect x="10" y="10" width="780" height="44" fill="#eeeeee" stroke="#333"/>
  <text x="30" y="37" font-weight="bold">SOS Enchentes</text>
  <text x="520" y="37" text-decoration="underline">Campanhas</text>
  <text x="610" y="37" text-decoration="underline">Doações</text>
  <text x="685" y="37" text-decoration="underline">Voluntários</text>

  <!-- Voltar -->
  <rect x="40" y="70" width="170" height="28" rx="4" fill="none" stroke="#333"/>
  <text x="125" y="89" text-anchor="middle" font-size="12">← Voltar para Campanhas</text>

  <!-- Card de detalhes -->
  <rect x="40" y="112" width="720" height="350" fill="#fafafa" stroke="#333"/>
  <text x="60" y="145" font-weight="bold" font-size="20">Título da campanha</text>
  <text x="60" y="170" fill="#555">Cidade — Bairro: Nome do bairro</text>
  <line x1="60" y1="185" x2="740" y2="185" stroke="#999"/>

  <text x="60" y="210" font-weight="bold">Sobre a Campanha</text>
  <rect x="60" y="220" width="640" height="8" fill="#cccccc"/>
  <rect x="60" y="234" width="600" height="8" fill="#cccccc"/>
  <rect x="60" y="248" width="420" height="8" fill="#cccccc"/>

  <text x="60" y="285" font-weight="bold">Itens Necessários</text>
  <text x="75" y="305">• Água</text>
  <text x="75" y="323">• Alimentos</text>
  <text x="75" y="341">• Produtos de higiene</text>

  <rect x="60" y="358" width="680" height="32" fill="#e6e6e6" stroke="#333"/>
  <text x="75" y="379">Esta campanha está aceitando inscrições de voluntários.</text>

  <rect x="60" y="405" width="330" height="42" rx="4" fill="#333"/>
  <text x="225" y="431" text-anchor="middle" fill="#fff" font-weight="bold">Quero doar</text>
  <rect x="410" y="405" width="330" height="42" rx="4" fill="#666"/>
  <text x="575" y="431" text-anchor="middle" fill="#fff" font-weight="bold">Quero ser voluntário</text>

  <!-- Anotações -->
  <text x="40" y="490" font-size="12" fill="#555">• O id vem da URL /campanhas/:id e chega ao componente como prop (props: true)</text>
  <text x="40" y="510" font-size="12" fill="#555">• Busca GET /api/campanhas/:id — se 404 mostra "Campanha não encontrada"</text>
  <text x="40" y="530" font-size="12" fill="#555">• Botões levam para /ajudar/:id?tipo=doacao ou ?tipo=voluntario (desabilitado se a campanha não precisa)</text>
</svg>
