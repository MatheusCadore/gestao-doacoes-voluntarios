<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <rect width="800" height="660" fill="#ffffff"/>
  <rect x="10" y="10" width="780" height="640" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Navbar -->
  <rect x="10" y="10" width="780" height="44" fill="#eeeeee" stroke="#333"/>
  <text x="30" y="37" font-weight="bold">SOS Enchentes</text>
  <text x="520" y="37" text-decoration="underline">Campanhas</text>
  <text x="610" y="37" text-decoration="underline">Doações</text>
  <text x="685" y="37" text-decoration="underline">Voluntários</text>

  <!-- Voltar -->
  <rect x="40" y="70" width="160" height="28" rx="4" fill="none" stroke="#333"/>
  <text x="120" y="89" text-anchor="middle" font-size="12">← Voltar aos Detalhes</text>

  <!-- Card do formulário -->
  <rect x="140" y="110" width="400" height="470" fill="#fafafa" stroke="#333"/>
  <text x="160" y="140" font-weight="bold" font-size="17">Registrar Participação</text>

  <rect x="160" y="152" width="360" height="50" fill="#ffffff" stroke="#999"/>
  <text x="172" y="172" font-weight="bold">Título da campanha</text>
  <text x="172" y="192" font-size="12" fill="#555">Cidade - Bairro</text>

  <text x="160" y="225" font-weight="bold">Tipo de ajuda *</text>
  <rect x="160" y="232" width="360" height="28" fill="#fff" stroke="#333"/><text x="170" y="251">Doação</text><text x="505" y="251">▾</text>

  <text x="160" y="282">Nome completo *</text>
  <rect x="160" y="289" width="360" height="28" fill="#fff" stroke="#333"/>

  <text x="160" y="339">Telefone para contato *</text>
  <rect x="160" y="346" width="360" height="28" fill="#fff" stroke="#333"/><text x="170" y="365" fill="#999">(00) 00000-0000</text>

  <text x="160" y="396">Tipo de item *</text>
  <rect x="160" y="403" width="175" height="28" fill="#fff" stroke="#333"/><text x="170" y="422" fill="#999">Selecione</text><text x="320" y="422">▾</text>
  <text x="345" y="396">Quantidade *</text>
  <rect x="345" y="403" width="175" height="28" fill="#fff" stroke="#333"/><text x="355" y="422">1</text>

  <text x="160" y="453">Descrição adicional</text>
  <rect x="160" y="460" width="360" height="46" fill="#fff" stroke="#333"/>

  <rect x="160" y="525" width="250" height="38" rx="4" fill="#333"/>
  <text x="285" y="549" text-anchor="middle" fill="#fff" font-weight="bold">Confirmar participação</text>
  <rect x="420" y="525" width="100" height="38" rx="4" fill="none" stroke="#333"/>
  <text x="470" y="549" text-anchor="middle">Cancelar</text>

  <!-- Painel lateral: campos de voluntariado -->
  <rect x="560" y="232" width="210" height="150" fill="#ffffff" stroke="#333" stroke-dasharray="5 4"/>
  <text x="572" y="252" font-weight="bold" font-size="12">Se "Voluntariado":</text>
  <text x="572" y="276" font-size="12">Disponibilidade *</text>
  <rect x="572" y="283" width="186" height="24" fill="#fff" stroke="#333"/><text x="742" y="300" font-size="12">▾</text>
  <text x="572" y="328" font-size="12">Atividade desejada *</text>
  <rect x="572" y="335" width="186" height="24" fill="#fff" stroke="#333"/><text x="742" y="352" font-size="12">▾</text>
  <line x1="540" y1="246" x2="560" y2="246" stroke="#333" stroke-dasharray="3 3"/>

  <!-- Painel lateral: mensagem de sucesso -->
  <rect x="560" y="400" width="210" height="90" fill="#e6e6e6" stroke="#333"/>
  <text x="572" y="420" font-weight="bold" font-size="12">Após enviar com sucesso:</text>
  <text x="572" y="440" font-size="12">"Participação registrada!"</text>
  <rect x="572" y="452" width="186" height="26" rx="4" fill="#333"/>
  <text x="665" y="470" text-anchor="middle" fill="#fff" font-size="12">Voltar para campanhas</text>

  <!-- Anotações -->
  <text x="40" y="605" font-size="12" fill="#555">• Validação no front antes do envio (nome, telefone com 10/11 dígitos, item, quantidade &gt; 0)</text>
  <text x="40" y="625" font-size="12" fill="#555">• Envia POST /api/doacoes ou POST /api/voluntarios; erro do backend aparece num alerta acima do botão</text>
</svg>
